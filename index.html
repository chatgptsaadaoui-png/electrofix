<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectroFix Manager</title>
    <script>
      // Ensure window.fetch is writable to prevent "only a getter" errors
      (function() {
        try {
          const d = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (d && (d.get || !d.writable) && d.configurable) {
            const f = window.fetch;
            delete window.fetch;
            window.fetch = f;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
