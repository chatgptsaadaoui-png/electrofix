<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElectroFix Manager</title>
    <script>
      // Intercept attempts to redefine window.fetch
      (function() {
        const originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(value) {
              console.error('DEBUG: Attempt to redefine window.fetch detected!');
              console.error('DEBUG: Value:', value);
              console.trace();
              // We don't throw here to avoid breaking the script that's trying to set it,
              // but we log the trace to see where it's coming from.
              // Actually, the error says it's already a getter-only property.
            },
            configurable: true
          });
          console.log('DEBUG: window.fetch interceptor installed');
        } catch (e) {
          console.error('DEBUG: Failed to install window.fetch interceptor:', e);
        }
      })();
    </script>
    <script>
      // Debugging script to catch the fetch error
      window.addEventListener('error', function(event) {
        if (event.message && event.message.includes('fetch')) {
          console.error('DEBUG: Caught fetch error:', event.message);
          if (event.error && event.error.stack) {
            console.error('DEBUG: Stack trace:', event.error.stack);
          }
        }
      }, true);
      console.log('DEBUG: Debugging script loaded');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=1"></script>
  </body>
</html>
